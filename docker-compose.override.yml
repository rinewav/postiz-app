# Local overrides for the upstream docker-compose.yaml (merged automatically by
# `docker compose up -d`). Keeps every secret in `.env` (gitignored) instead of
# editing the upstream compose file, so `git rebase upstream/main` stays
# conflict-free. See `.env.docker.example` and README.zernio.md.
services:
  postiz:
    # Built from this fork (upstream + the YouTube (Zernio) integration)
    # instead of ghcr.io/gitroomhq/postiz-app:latest.
    image: postiz-zernio:local
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: ${POSTIZ_VERSION:-zernio}
    environment:
      MAIN_URL: ${POSTIZ_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL:-http://localhost:4007}/api
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}

      # X (official API, existing Postiz provider)
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}

      # Instagram (official Meta API, existing Postiz providers)
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}

      # YouTube via Zernio (youtube-zernio provider). The key never goes to the DB.
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_PROFILE_ID: ${ZERNIO_PROFILE_ID:-}
      ZERNIO_API_URL: ${ZERNIO_API_URL:-}
      ZERNIO_MAX_RETRIES: ${ZERNIO_MAX_RETRIES:-2}
      # e.g. "youtube" to hide the Google-Cloud-based YouTube provider
      HIDDEN_PROVIDERS: ${HIDDEN_PROVIDERS:-}
    # backend/orchestrator hang at boot if Temporal isn't ready yet and never
    # recover on their own: wait for it.
    depends_on:
      temporal:
        condition: service_healthy
    # Makes a stuck boot visible in `docker compose ps` (unhealthy): recover with
    # `docker compose restart postiz`. Checks the backend and the orchestrator.
    healthcheck:
      test: ['CMD', 'node', '-e', 'Promise.all([fetch("http://127.0.0.1:3000/"),fetch("http://127.0.0.1:3002/health/status")]).then((r)=>process.exit(r.every((x)=>x.ok)?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  # Upstream starts temporal without waiting for its database, so on a cold
  # start it can exit ("no usable database connection") and stay down.
  temporal:
    restart: on-failure
    healthcheck:
      # serving AND the default namespace + its search attributes are ready
      # (Postiz reads/registers search attributes at boot and hangs otherwise)
      test: ['CMD-SHELL', 'A=$$(hostname -i):7233; temporal operator namespace describe -n default --address $$A >/dev/null 2>&1 && temporal operator search-attribute list -n default --address $$A >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Local Zernio API mock for end-to-end tests, only started with
  # `docker compose --profile zernio-mock up -d` (then set
  # ZERNIO_API_URL=http://zernio-mock:4010/api and ZERNIO_API_KEY=sk_mock).
  zernio-mock:
    profiles: ['zernio-mock']
    image: node:22.20-bookworm-slim
    container_name: zernio-mock
    command: ['node', '/mock/server.mjs']
    environment:
      PORT: '4010'
      MOCK_API_KEY: sk_mock
      PUBLIC_URL: http://localhost:4010
      INTERNAL_URL: http://zernio-mock:4010
    volumes:
      - ./tools/zernio-mock:/mock:ro
    ports:
      - '4010:4010'
    networks:
      - postiz-network
