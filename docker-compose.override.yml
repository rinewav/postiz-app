# Local overrides for the upstream docker-compose.yaml (merged automatically by
# `docker compose up -d`). Keeps every secret in `.env` (gitignored) instead of
# editing the upstream compose file, so `git rebase upstream/main` stays
# conflict-free. See `.env.docker.example` and README.zernio.md.
services:
  postiz:
    # Built from this fork (upstream + the YouTube (Zernio) integration)
    # instead of ghcr.io/gitroomhq/postiz-app:latest.
    image: postiz-zernio:local
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: ${POSTIZ_VERSION:-zernio}
    environment:
      MAIN_URL: ${POSTIZ_URL:-http://localhost:4007}
      FRONTEND_URL: ${POSTIZ_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL:-http://localhost:4007}/api
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}

      # X (official API, existing Postiz provider)
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}

      # Instagram (official Meta API, existing Postiz providers)
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}

      # YouTube via Zernio (youtube-zernio provider). The key never goes to the DB.
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_PROFILE_ID: ${ZERNIO_PROFILE_ID:-}
      ZERNIO_API_URL: ${ZERNIO_API_URL:-}
      ZERNIO_MAX_RETRIES: ${ZERNIO_MAX_RETRIES:-2}
      # e.g. "youtube" to hide the Google-Cloud-based YouTube provider
      HIDDEN_PROVIDERS: ${HIDDEN_PROVIDERS:-}

